plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'xyz.wagyourtail.unimined' version '1.4.26-kappa'
}

version = mod_version
group = root_package
base { archivesName = mod_id }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

configurations {
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

// Explicit diagnostic task only: never added to the production JAR or assemble.
def r1LocalLightProbeJar = tasks.register('r1LocalLightProbeJar', Jar) {
    group = 'verification'
    description = 'Packages the isolated R1 dedicated-server probe (not a release mod).'
    dependsOn tasks.named('compileTestJava')
    archiveBaseName = 'stellarsky-r1-local-light-probe'
    archiveClassifier = 'dev'
    destinationDirectory = layout.buildDirectory.dir('diagnostics/r1')
    from(sourceSets.test.output.classesDirs) {
        include 'stellarium/world/ring/R1LocalLightProbeMod*.class'
    }
    doFirst {
        if (!sourceSets.test.output.classesDirs.files.any {
            new File(it, 'stellarium/world/ring/R1LocalLightProbeMod.class').isFile()
        }) {
            throw new GradleException('R1 diagnostic probe class is missing; refusing an empty probe JAR.')
        }
    }
}

unimined.minecraft {
    version '1.12.2'
    mappings { mcp('stable', '39-1.12') }
    cleanroom {
        loader '0.6.8-alpha'
        runs.all {
            args += ['--username', minecraft_username]
            systemProperty('fml.noSplash', 'true')
            if (is_coremod.toBoolean()) systemProperty('fml.coreMods.load', coremod_plugin_class_name)
        }
    }
    defaultRemapJar = false
    remap(tasks.named('jar').get())
    remap(r1LocalLightProbeJar.get(), 'remapR1LocalLightProbeJar') {
        archiveBaseName = 'stellarsky-r1-local-light-probe'
        archiveClassifier = ''
        destinationDirectory = layout.buildDirectory.dir('diagnostics/r1')
    }
    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://curse.cleanroommc.com' }
}

dependencies {
    compileOnly 'com.cleanroommc:sponge-mixin:0.20.13+mixin.0.8.7'
    compileOnly 'com.cleanroommc:lwjglx:1.0.0'
    modCompileOnly project(':stellarapi')
    modRuntimeOnly files('../StellarAPI/build/libs/stellarapi-1.12.2-0.5.2.3.jar')
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly project(':stellarapi')
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

processResources {
    def metadata = [version: project.version, mcversion: '1.12.2']
    inputs.properties(metadata)
    filesMatching('mcmod.info') { expand(metadata) }
}

compileJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// This fixture installs WorldSets/sky registries whose production API has no
// reset operation. Keep it in a dedicated JVM rather than leak it to other suites.
tasks.register('clientSceneCandidateTest', Test) {
    group = 'verification'
    description = 'Runs client scene candidate regressions in an isolated test JVM.'
    testClassesDirs = sourceSets.test.output.classesDirs
    include '**/StellarSceneCandidateTest.class'
}

tasks.withType(Test).configureEach {
    dependsOn tasks.named('testClasses')
    dependsOn(':stellarapi:remapJar')
    // Headless tests run against MCP-named Minecraft. The SRG release JAR is
    // still built/audited, but must not shadow the sibling's matching MCP output.
    classpath = files(providers.provider { project(':stellarapi').sourceSets.main.output }) + sourceSets.test.runtimeClasspath
    systemProperty 'stellarsky.expectedVersion', project.version.toString()
}

tasks.named('test') {
    dependsOn tasks.named('clientSceneCandidateTest')
    exclude '**/StellarSceneCandidateTest.class'
}

jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE_stellarsky' }
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    manifest {
        attributes(
                'ModType': 'CRL',
                'FMLCorePlugin': coremod_plugin_class_name,
                'FMLCorePluginContainsFMLMod': true,
                'Fabric-Loom-Mixin-Remap-Type': 'mixin'
        )
    }
    finalizedBy tasks.named('remapJar')
}
